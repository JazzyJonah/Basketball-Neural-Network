name: Refresh data and deploy GitHub Pages

on:
  # Rebuild whenever code changes.
  push:
    branches:
      - main

  # Allows manual runs from the Actions tab.
  workflow_dispatch:

  # Refresh the upcoming schedule every morning.
  schedule:
    - cron: "17 7 * * *"
      timezone: "America/New_York"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # PYTHON DATA REFRESH
      # ------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pages.txt

      - name: Refresh upcoming NCAA schedule
        run: |
          python scripts/build_upcoming_games.py

      # ------------------------------------------------------------
      # FRONTEND BUILD
      # ------------------------------------------------------------

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      # Ensure the ONNX Runtime binary exactly matches the npm package
      # being used by the frontend.
      - name: Copy ONNX Runtime WASM binary
        run: |
          mkdir -p web/public/ort
          cp web/node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm \
             web/public/ort/ort-wasm-simd-threaded.wasm

      - name: Build website
        working-directory: web
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4